name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a source silently changing its field names is found without anyone pushing.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # Offline only: the suite mocks the network, so CI never depends on a third-party
      # API being up, and never rate-limits anyone.
      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Lint
        run: uv run --extra dev ruff check src tests

      - name: Check the server starts and registers its tools
        run: |
          uv run python -c "
          import asyncio
          from academic_research_mcp.server import mcp

          EXPECTED = {
              'search_papers', 'get_paper', 'find_similar', 'get_citations',
              'find_fulltext', 'read_fulltext', 'download_pdf', 'list_sources',
          }

          async def main():
              tools = await mcp.list_tools()
              names = {t[0] if isinstance(t, tuple) else t.name for t in tools}
              missing = EXPECTED - names
              assert not missing, f'missing tools: {missing}'
              print(f'{len(names)} tools registered: {sorted(names)}')

          asyncio.run(main())
          "

  # Live API checks are allowed to fail without blocking a merge: an upstream outage is
  # not a regression in this repo. Run them on a schedule instead, where a failure is
  # actionable (a source changed its field names).
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -m live -q
        env:
          RESEARCH_MCP_MAILTO: ${{ secrets.RESEARCH_MCP_MAILTO }}

