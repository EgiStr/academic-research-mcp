name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a source silently changing its field names is found without anyone pushing.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # Offline only: the suite mocks the network, so CI never depends on a third-party
      # API being up, and never rate-limits anyone.
      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Lint
        run: uv run --extra dev ruff check src tests

      - name: Check the server starts and registers its tools
        run: |
          # Over the real stdio transport, not by reaching into the module: this is what a
          # host does, and the only way an import-time or registration break shows up.
          # An earlier version read `t[0] if isinstance(t, tuple) else t.name`, which fell
          # through to iterating ListToolsResult's own fields and passed while checking
          # nothing. Reading `.tools` is the actual API.
          uv run python - <<'PY'
          import asyncio, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          EXPECTED = {
              "search_papers", "get_paper", "find_similar", "get_citations",
              "find_fulltext", "read_fulltext", "download_pdf", "list_sources",
          }

          async def main():
              env = {k: v for k, v in os.environ.items() if not k.startswith("PAPERSEARCH_MCP_")}
              params = StdioServerParameters(command=sys.executable, args=["-m", "papersearch_mcp"], env=env)
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      result = await session.list_tools()
                      names = {t.name for t in result.tools}
                      extra, missing = names - EXPECTED, EXPECTED - names
                      assert not extra and not missing, f"tool set changed: extra={extra} missing={missing}"
                      print(f"{len(names)} tools registered")

          asyncio.run(main())
          PY

  # Live API checks are allowed to fail without blocking a merge: an upstream outage is
  # not a regression in this repo. Run them on a schedule instead, where a failure is
  # actionable (a source changed its field names).
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -m live -q
        env:
          PAPERSEARCH_MCP_MAILTO: ${{ secrets.PAPERSEARCH_MCP_MAILTO }}

