[project]
name = "papersearch-mcp"
version = "0.1.0"
description = "Keyless MCP server for academic literature: search, citations, similar papers, open-access full text and PDF downloads from OpenAlex, arXiv, Crossref, Europe PMC, DOAJ and Unpaywall — no API keys, ever."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "research", "academic", "papers", "openalex", "arxiv", "literature-review", "no-api-key", "citations", "open-access", "pdf-download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # 2.x renamed FastMCP to MCPServer; this server targets that API.
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
papersearch-mcp = "papersearch_mcp:main"

[project.urls]
Homepage = "https://github.com/EgiStr/papersearch-mcp"
Issues = "https://github.com/EgiStr/papersearch-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` tests hit the real APIs; run them explicitly with `uv run pytest -m live`.
markers = ["live: hits real academic APIs over the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned ruleset, so a ruff release adding a rule cannot turn a passing build red. Widen
# deliberately, with `uv run ruff check --fix` applied in the same commit.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "PIE", "FURB"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internal state and use short variable names on purpose.
"tests/*" = ["S101", "S105", "S106", "S108", "S104"]

