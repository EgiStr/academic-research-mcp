[project]
name = "academic-research-mcp"
version = "0.1.0"
description = "Keyless MCP server for academic literature: search, citations, similar papers, open-access full text and PDF downloads from OpenAlex, arXiv, Crossref, Europe PMC, DOAJ and Unpaywall — no API keys, ever."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "research", "academic", "papers", "openalex", "arxiv", "literature-review", "no-api-key", "citations", "open-access", "pdf-download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # 2.x renamed FastMCP to MCPServer; this server targets that API.
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
academic-research-mcp = "academic_research_mcp:main"

[project.urls]
Homepage = "https://github.com/EgiStr/academic-research-mcp"
Issues = "https://github.com/EgiStr/academic-research-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` tests hit the real APIs; run them explicitly with `uv run pytest -m live`.
markers = ["live: hits real academic APIs over the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py310"
